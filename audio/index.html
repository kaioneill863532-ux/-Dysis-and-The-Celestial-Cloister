<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>日落回廊音效</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+SC:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 布局：一条窄的工作栏（混响、音量、全部停止）+ 按编号排下来的条目；每条左边是排期编号，右边是说明和播放按钮。白天的声音用落日的金，夜里的用青金石的蓝。 */
:root {
  --bg: #eceef1;          /* 东半边的青白石 */
  --surface: #f7f8fa;
  --ink: #1b2130;
  --muted: #586073;
  --line: #d3d8e0;
  --sun: #9a5f00;         /* 落日的金 */
  --sun-soft: #f4e6c8;
  --moon: #2f5592;        /* 青金石 */
  --moon-soft: #dbe4f3;
  --both: #3d4558;
  --both-soft: #e1e4ea;
  --focus: #2f5592;
  --font-display: "Marcellus", "Noto Serif SC", "Songti SC", serif;
  --font-head: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1120; --surface: #151a2b; --ink: #e5e8f0; --muted: #9aa2b7; --line: #283049;
    --sun: #e2b252; --sun-soft: #3a2f17; --moon: #a8bfec; --moon-soft: #1f2b47; --both: #c9cedb; --both-soft: #252c40;
    --focus: #a8bfec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1120; --surface: #151a2b; --ink: #e5e8f0; --muted: #9aa2b7; --line: #283049;
  --sun: #e2b252; --sun-soft: #3a2f17; --moon: #a8bfec; --moon-soft: #1f2b47; --both: #c9cedb; --both-soft: #252c40;
  --focus: #a8bfec; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
header.top { display: grid; gap: 10px; padding-block: 8px 20px; }
.eyebrow { font: 500 12px/1.4 var(--font-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
h1 { margin: 0; font: 600 34px/1.25 var(--font-head); letter-spacing: 0.04em; text-wrap: balance; }
h1 .lat { font-family: var(--font-display); font-weight: 400; font-size: 0.62em; letter-spacing: 0.06em; color: var(--muted); margin-left: 0.4em; }
.lede { margin: 0; max-width: 66ch; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.day { background: var(--sun); } .dot.night { background: var(--moon); } .dot.both { background: var(--both); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; margin-bottom: 8px; }
.bar label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.bar input[type="range"] { width: 120px; accent-color: var(--moon); }
.switch { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch:checked { background: var(--moon); }
.switch:checked::after { transform: translateX(16px); }
.bar .note { font-size: 12.5px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
button { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

h2.tier { font: 600 20px/1.4 var(--font-head); margin: 34px 0 4px; letter-spacing: 0.06em; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h2.tier small { font: 400 13px var(--font-body); color: var(--muted); letter-spacing: 0; }

.item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 18px; padding-block: 22px; border-top: 1px solid var(--line); }
.num { font: 400 40px/1 var(--font-display); color: var(--accent); padding-top: 4px; font-variant-numeric: tabular-nums; }
.item.day { --accent: var(--sun); --soft: var(--sun-soft); }
.item.night { --accent: var(--moon); --soft: var(--moon-soft); }
.item.both, .item.ui { --accent: var(--both); --soft: var(--both-soft); }
.body { min-width: 0; display: grid; gap: 8px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.head h3 { margin: 0; font: 600 19px/1.4 var(--font-head); letter-spacing: 0.03em; }
.tag { font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--soft); color: var(--accent); white-space: nowrap; }
.reason { font-size: 13.5px; color: var(--muted); }
.what { margin: 0; max-width: 72ch; }
details.ue { max-width: 72ch; font-size: 14px; color: var(--muted); }
details.ue summary { cursor: pointer; color: var(--ink); font-size: 13.5px; width: fit-content; }
details.ue p { margin: 6px 0 0; }

.groups { display: grid; gap: 8px; margin-top: 4px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.glabel { font-size: 12.5px; color: var(--muted); min-width: 64px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 3px 10px 3px 8px; cursor: pointer; font: 400 12.5px/1.5 var(--font-mono); color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.chip .tri { width: 0; height: 0; border-left: 7px solid var(--accent); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.chip .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.loop .dur::after { content: " ∞"; }
.chip.playing { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip.playing .tri { border: 0; width: 8px; height: 8px; background: var(--surface); }
.chip.playing .dur { color: var(--surface); }
.chip.seq { font-family: var(--font-body); border-style: dashed; }
.chip.compact { padding-inline: 7px 9px; font-variant-numeric: tabular-nums; }
.prefix { font: 400 11.5px/1.4 var(--font-mono); color: var(--muted); width: 100%; order: 99; padding-left: 70px; overflow-wrap: anywhere; }

footer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 10px; }
footer h2 { font: 600 16px/1.4 var(--font-head); color: var(--ink); margin: 0; }
.credits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 18px; }
.credits a { color: var(--muted); text-decoration: none; overflow-wrap: anywhere; }
.credits a:hover { color: var(--ink); text-decoration: underline; }
.credits b { font-weight: 500; color: var(--ink); }

@media (max-width: 560px) {
  h1 { font-size: 27px; }
  .item { grid-template-columns: minmax(0, 1fr); }
  .num { font-size: 30px; }
  .glabel { min-width: 0; width: 100%; }
  .prefix { padding-left: 0; }
  .bar .note { display: none; }
  .bar input[type="range"] { width: 90px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Dysis and the Celestial Cloister · SFX</div>
    <h1>日落回廊音效<span class="lat">Tier I–II</span></h1>
    <p class="lede" id="lede"></p>
    <div class="legend" aria-label="颜色说明">
      <span><i class="dot day"></i>白天（日光）</span>
      <span><i class="dot night"></i>夜里（月光）</span>
      <span><i class="dot both"></i>全程 / 界面</span>
    </div>
  </header>

  <div class="bar" role="toolbar" aria-label="播放设置">
    <label for="rev"><input type="checkbox" class="switch" id="rev"> 殿内混响</label>
    <label for="vol">音量 <input type="range" id="vol" min="0" max="1.5" step="0.01" value="1"></label>
    <button class="btn" id="stopAll" type="button">全部停止</button>
    <span class="note" id="note">点一个按钮就播；再点一次停。带 ∞ 的是循环，可以几条叠着播（比如海浪 + 瀑布）。</span>
  </div>

  <main id="list"></main>

  <footer>
    <h2>素材出处</h2>
    <p style="margin:0">全部是 Freesound 上的 CC0（公有领域）录音：可以商用、可以改，不需要署名。</p>
    <div class="credits" id="credits"></div>
  </footer>
</div>

ath_Reveal/SFX_LightPath_Reveal_03.wav", "name": "SFX_LightPath_Reveal_03", "group": "显形", "loop": false, "ch": 2, "dur": 2.5, "lufs": -25.0}, {"path": "sfx/05_LightPath_Reveal/SFX_LightPath_Reveal_04.wav", "name": "SFX_LightPath_Reveal_04", "group": "显形", "loop": false, "ch": 2, "dur": 2.5, "lufs": -25.0}, {"path": "sfx/05_LightPath_Reveal/SFX_LightPath_Reveal_05.wav", "name": "SFX_LightPath_Reveal_05", "group": "显形", "loop": false, "ch": 2, "dur": 2.5, "lufs": -25.0}, {"path": "sfx/05_LightPath_Reveal/SFX_LightPath_Reveal_06.wav", "name": "SFX_LightPath_Reveal_06", "group": "显形", "loop": false, "ch": 2, "dur": 2.5, "lufs": -25.0}], "reason": "每束光出现都靠它提示“这里能走了”，全程反复出现", "when": "day"}, {"num": 6, "tier": 1, "key": "Moonstone", "zh": "月石显形、隐去", "what": "月光照到的石头：显形是一只真实颂钵（Coleco 的敲击录音）把木槌的硬起音抹软，变到月光的低音区，下面垫同一音高的摩擦颂钵（ryancacophony）和一点石头的细砂；隐去是摩擦颂钵的长音一边淡出一边往下沉一点点，混着真实的沙子流下的细声（nicoproson），像石头化成月光的尘。另有一个大号的“墙隐去”（月亮浮雕、双子厚墙、月之龛那几块大月石共用）。", "ue": "Appear：月石的 k 从 0 往 1 走时触发（只在开始那一下）；Vanish：从 1 往 0 走时触发。音高已经分开，Random 不重复即可。Wall_Vanish 给一次性隐去的大块月石。单声道，放在月石的中心。", "files": [{"path": "sfx/06_Moonstone/SFX_Moonstone_Appear_01.wav", "name": "SFX_Moonstone_Appear_01", "group": "显形", "loop": false, "ch": 1, "dur": 1.6, "lufs": -25.0}, {"path": "sfx/06_Moonstone/SFX_Moonstone_Appear_02.wav", "name": "SFX_Moonstone_Appear_02", "group": "显形", "loop": false, "ch": 1, "dur": 1.6, "lufs": -25.0}, {"path": "sfx/06_Moonstone/SFX_Moonstone_Appear_03.wav", "name": "SFX_Moonstone_Appear_03", "group": "显形", "loop": false, "ch": 1, "dur": 1.6, "lufs": -25.0}, {"path": "sfx/06_Moonstone/SFX_Moonstone_Appear_04.wav", "name": "SFX_Moonstone_Appear_04", "group": "显形", "loop": false, "ch": 1, "dur": 1.63, "lufs": -25.0}, {"path": "sfx/06_Moonstone/SFX_Moonstone_Vanish_01.wav", "name": "SFX_Moonstone_Vanish_01", "group": "隐去", "loop": false, "ch": 1, "dur": 2.2, "lufs": -27.0}, {"path": "sfx/06_Moonstone/SFX_Moonstone_Vanish_02.wav", "name": "SFX_Moonstone_Vanish_02", "group": "隐去", "loop": false, "ch"  0.59, "lufs": -23.0}, {"path": "sfx/08_Jump_Land/SFX_Land_Light_02.wav", "name": "SFX_Land_Light_02", "group": "落地·光", "loop": false, "ch": 1, "dur": 0.61, "lufs": -23.0}, {"path": "sfx/08_Jump_Land/SFX_Land_Light_03.wav", "name": "SFX_Land_Light_03", "group": "落地·光", "loop": false, "ch": 1, "dur": 0.65, "lufs": -23.0}], "reason": "光阶等关卡的基本操作", "when": "both"}, {"num": 9, "tier": 1, "key": "Fall_Respawn", "zh": "掉落、回到落脚点", "what": "掉落：耳边的风越来越大（粉噪做的湍流风，中心频率和响度一直在抖），加上长袍被风吹着抖动；有一个起头（1.6 秒，风从无到大）和一个可以一直循环的风。回到落脚点：不惩罚——光像吸一口气一样聚回来（水晶杯音倒着长出来），落在一个温暖的五度上，最后一声很轻的落脚。日、夜各一个。", "ue": "Fall_Start：离开地面、下落速度超过阈值时播；接着播 Fall_Loop（Looping），回到落脚点时 0.15 秒淡出。Respawn_Day / Respawn_Night：人重新出现在落脚点的那一刻（白天用日光的，入夜以后用月光的）。", "files": [{"path": "sfx/09_Fall_Respawn/SFX_Fall_Start.wav", "name": "SFX_Fall_Start", "group": "掉落", "loop": false, "ch": 2, "dur": 1.8, "lufs": -19.2}, {"path": "sfx/09_Fall_Respawn/SFX_Fall_Loop.wav", "name": "SFX_Fall_Loop", "group": "掉落·循环", "loop": true, "ch": 2, "dur": 5.5, "lufs": -22.0}, {"path": "sfx/09_Fall_Respawn/SFX_Respawn_Day.wav", "name": "SFX_Respawn_Day", "group": "回到落脚点", "loop": false, "ch": 2, "dur": 2.1, "lufs": -24.0}, {"path": "sfx/09_Fall_Respawn/SFX_Respawn_Night.wav", "name": "SFX_Respawn_Night", "group": "回到落脚点", "loop": false, "ch": 2, "dur": 2.1, "lufs": -24.0}], "reason": "让玩家放心“没有死亡”", "when": "both"}, {"num": 10, "tier": 1, "key": "Waterfall", "zh": "瀑布", "what": "从天花板一直泻进水庭的厚瀑布。近处：一段很稳的真实大瀑布（saralana，258 秒的录音里挑最匀的一段）打底，叠一层真实的小瀑布近距离的水花（Nox_Sound），低频稍微加厚（落差 30 米）；远处：同一瀑布滤到只剩低沉的轰鸣，窄一点，给殿里别的楼层。都是无缝循环。", "ue": "两层都 Looping，放在瀑布中心：Near 的衰减半径约 6–25 m，Far 约 15–60 m，两层叠着用。水闸打开以前两层都停；开闸时先播 14 的 Waterfall_Start，它的结尾直接接上这两条循环。", "files": [{"path": "sfx/10_Waterfall/SFX_Waterfall_Near_Loop.wav", "name": "SFX_Waterfall_Near_Loop", "group": "近", "loop": true, "ch": 2, "dur": 12.0, "lufs": -21.0}, {"path": "sfx/10_Waterfall/SFX_Waterfall_Far_Loop.wav", "name": "SFX_Waterfall_Far_Loop", "group": "远", "loop": true, "ch": 2, "dur": 12.0, "lufs": -24.0}], "reason": "日1 的核心机关，又是贯穿全程的环境声", "when": "both"}, {"num": 11, "tier": 1, "key": "Sea_Waves", "zh": "海浪", "what": "开场第一声。近处（岛上、海面高度）：真实的浪拍礁石（dan.pugsley，一个个浪的起落很清楚）；远处（台地、殿外回廊、殿里）：真实的“从崖上听海”（bruno.auzet），本来就是在悬崖上录的，再滤掉一点高频。都是无缝循环。", "ue": "Close：放在岛的外沿和崖脚，衰减半径约 10–40 m；Far：2D 或者放大半径（80 m 以上），殿外一直在，进殿以后用 Audio Volume 压低 8–12 dB、再低通到 800 Hz 左右。", "files": [{"path": "sfx/11_Sea_Waves/SFX_Sea_Waves_Close_Loop.wav", "name": "SFX_Sea_Waves_Close_Loop", "group": "近", "loop": true, "ch": 2, "dur": 30.0, "lufs": -22.1}, {"path": "sfx/11_Sea_Waves/SFX_Sea_Waves_Far_Loop.wav", "name": "SFX_Sea_Waves_Far_Loop", "group": "远", "loop": true, "ch": 2, "dur": 30.0, "lufs": -25.0}], "reason": "开场第一声，殿外一直在", "when": "both"}, {"num": 14, "tier": 2, "key": "Sluice_Waterfall_Start", "zh": "水闸轮转动、瀑布开始流", "what": "第一个机关。闸轮：真实的木轮转动（KVV_Audio）降调成大轮子，加上绞盘棘爪一格一格的咔哒（kyles 的滑轮绞盘），轴上很低的一声呻吟，最后石闸被拉开时“咚”地到位。瀑布开始流：先是一股水冲出来（HonorHunter 的水涌），再是从 30 米高处稀稀拉拉砸进水池的水（Breviceps 的倒水），然后真正的瀑布从低沉的闷响打开成整片的轰鸣（低通一路扫开），最后一秒和 10 的 Near 循环开头完全一样，能直接接上。另附一个关水闸、瀑布停下的版本。", "ue": "玩家按 E 开水闸：播 Sluice_Wheel_Turn（2.6 s）；它播到 2.2 s 左右（闸到位那一下）开始播 Waterfall_Start，Waterfall_Start 的最后 1 秒是等功率淡出：它播到 4.0 s 时启动 10 的 Near/Far 两条循环，Fade In 1 s、曲线选 Sin（Equal Power）。关水闸：Waterfall_Stop 开头 1 秒是等功率淡入，播它的同时让两条循环 Fade Out 1 s（同样的曲线）。", "files": [{"path": "sfx/14_Sluice_Waterfall_Start/SFX_Sluice_Wheel_Turn.wav", "name": "SFX_Sluice_Wheel_Turn", "group": "闸轮", "loop": false, "ch": 1, "dur": 2.9, "lufs": -20.3}, {"path": "sfx/14_Sluice_Waterfall_Start/SFX_Waterfall_Start.wav", "name": "SFX_Waterfall_Start", "group": "瀑布开始流", "loop": false, "ch": 2, "dur": 5.0, "lufs": -20.6}, {"path": "sfx/14_Sluice_Waterfall_Start/SFX_Waterfall_Stop.wav", "name": "SFX_Waterfall_Stop", "group": "瀑布停下", "loop": false, "ch": 2, "dur": 4.0, "lufs": -20.5}], "reason": "第一个机关，教会玩家“动机关会改变光”", "when": "day"}, {"num": 15, "tier": 2, "key": "Steps_Rise_Settle", "zh": "台阶升起、落平", "what": "屋顶环道的 16 级踏步。每一级到位时是一声“石磬”：调过音的石条（两端自由的石条的真实振动比例 1 : 2.76 : 5.40 : 8.93），用真实的石头碰撞激发，16 级按 d 小调五声从 D3 一路升到 D6——音高逐级变高，本身就是“快到了”的反馈；每级还带一点铜叶片擦过的亮声（光圈叶片跟着升起来）。落平是同一个音低八度、更闷、更轻。另有一条踏步移动时的石头摩擦循环。", "ue": "Rise_XX：第 XX 级升到顶（停住）那一刻播，单声道放在那一级上。Settle_XX：入夜后第 XX 级落平到底时播。Move_Loop：只要有踏步在动就循环播放，音量跟踏步的移动速度走（0 → 停）。", "files": [{"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_01.wav", "name": "SFX_Steps_Rise_01", "group": "升起", "loop": false, "ch": 1, "dur": 0.89, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_02.wav", "name": "SFX_Steps_Rise_02", "group": "升起", "loop": false, "ch": 1, "dur": 0.91, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_03.wav", "name": "SFX_Steps_Rise_03", "group": "升起", "loop": false, "ch": 1, "dur": 0.9, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_04.wav", "name": "SFX_Steps_Rise_04", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_05.wav", "name": "SFX_Steps_Rise_05", "group": "升起", "loop": false, "ch": 1, "dur": 0.92, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_06.wav", "name": "SFX_Steps_Rise_06", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_07.wav", "name": "SFX_Steps_Rise_07", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_08.wav", "name": "SFX_Steps_Rise_08", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_09.wav", "name": "SFX_Steps_Rise_09", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_10.wav", "name": "SFX_Steps_Rise_10", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise_11.wav", "name": "SFX_Steps_Rise_11", "group": "升起", "loop": false, "ch": 1, "dur": 0.93, "lufs": -23.0}, {"path": "sfx/15_Steps_Rise_Settle/SFX_Steps_Rise .0}, {"path": "sfx/16_Lever_StoneSlab/SFX_Lever_Push.wav", "name": "SFX_Lever_Push", "group": "拉杆", "loop": false, "ch": 1, "dur": 1.7, "lufs": -21.0}, {"path": "sfx/16_Lever_StoneSlab/SFX_Slab_Slide_01.wav", "name": "SFX_Slab_Slide_01", "group": "石板滑动", "loop": false, "ch": 1, "dur": 2.4, "lufs": -19.0}, {"path": "sfx/16_Lever_StoneSlab/SFX_Slab_Slide_02.wav", "name": "SFX_Slab_Slide_02", "group": "石板滑动", "loop": false, "ch": 1, "dur": 2.4, "lufs": -19.0}], "reason": "日2 主线", "when": "day"}, {"num": 17, "tier": 2, "key": "Iris_Blades", "zh": "光圈叶片旋开", "what": "天花板上的 14 片青铜叶片一片接一片旋开：每一片是真实的金属滑过金属（LordForklift、Qat 的录音）降调成大块铜片，声像绕着头顶转一圈；底下是转动的机构（真实的木轮转动，降得很低）；全开时铜叶片轻轻共振成一个和弦（D、A，铜盘的真实振动比例）。合拢是倒过来的顺序、最后一声更实。还有一条叶片滑动的循环，给开合时间不固定的时候用。", "ue": "Iris_Open / Iris_Close：开、合的完整版（3.5 s）。光圈半径跟着玩家的位置慢慢变时（日4 走圆眼光柱），改用 Iris_Move_Loop，音量跟半径的变化速度走，停下时补一个 Open 的最后 1 秒（或者只停循环）。立体声，放在圆眼中心（头顶）。", "files": [{"path": "sfx/17_Iris_Blades/SFX_Iris_Open.wav", "name": "SFX_Iris_Open", "group": "开合", "loop": false, "ch": 2, "dur": 4.8, "lufs": -21.0}, {"path": "sfx/17_Iris_Blades/SFX_Iris_Close.wav", "name": "SFX_Iris_Close", "group": "开合", "loop": false, "ch": 2, "dur": 4.8, "lufs": -21.0}, {"path": "sfx/17_Iris_Blades/SFX_Iris_Move_Loop.wav", "name": "SFX_Iris_Move_Loop", "group": "滑动·循环", "loop": true, "ch": 2, "dur": 4.8, "lufs": -24.0}], "reason": "日4 的视觉奇观，需要声音撑住", "when": "day"}, {"num": 18, "tier": 2, "key": "Bridge_Gate", "zh": "桥门开、关", "what": "屋顶细桥尽头的青铜桥门绕门柱转 1.4 秒。开：老铜门轴的低沉呻吟（真实的大铁门吱呀声降了 6 个半音，去掉尖的部分），铜门本身微微共振，转到位轻轻一顿。关：同样的呻吟更快，最后是厚重的合拢（铁门撞击 + 石门砰地合上的低频）和一声落闩——接住最后一缕光以后它再也不开，所以关门要像“定了”。", "ue": "Gate_Open：人走近桥尾、门开始转时播；Gate_Close：接住最后一缕光、门开始转回去时播（合拢那一下在 1.35 s）。单声道，放在门轴上。", "files": [{"path": "sfx/18_Bridge_Gate/SFX_Gate_Open.wav", "name": "SFX_Gate_Open", "group": "开", "loop": false, "ch": 1, "dur": 2.4, "lufs": -20.0}, {"path": "sfx/18_Bridge_Gate/SFX_Gate_Close.wav", "name": "SFX_Gate_Close", "group": "关", "loop": false, "ch": 1, "dur": 3.6, "lufs": -18.0}], "reason": "日5 进门、入夜关门 道，放在浮雕中心。", "files": [{"path": "sfx/23_SwanRelief_Sink/SFX_SwanRelief_Sink.wav", "name": "SFX_SwanRelief_Sink", "group": "下沉", "loop": false, "ch": 1, "dur": 4.2, "lufs": -17.0}], "reason": "月2 的解谜奖励", "when": "night"}, {"num": 24, "tier": 2, "key": "Stairs_Lower", "zh": "楼梯降下", "what": "接住最后一缕光、回到桥头以后，另外半圈踏步一级接一级降成楼梯：12 块石头先后往下一沉、各自“咚”地落定（vestibule-door 的石面重击和石头落地，降调），从桥头沿着弧线一路过去（声像从右到左），间隔先快后慢，底下是整段的隆隆声。另附 4 个单级的版本，给程序逐级触发用。", "ue": "Stairs_Lower：楼梯开始降的那一刻播一次，立体声，放在楼梯中段。要逐级同步的话改用 Stairs_Lower_Step_01–04（单声道，放在那一级上，Random）。", "files": [{"path": "sfx/24_Stairs_Lower/SFX_Stairs_Lower.wav", "name": "SFX_Stairs_Lower", "group": "整段", "loop": false, "ch": 2, "dur": 5.0, "lufs": -18.0}, {"path": "sfx/24_Stairs_Lower/SFX_Stairs_Lower_Step_01.wav", "name": "SFX_Stairs_Lower_Step_01", "group": "单级", "loop": false, "ch": 1, "dur": 0.91, "lufs": -21.0}, {"path": "sfx/24_Stairs_Lower/SFX_Stairs_Lower_Step_02.wav", "name": "SFX_Stairs_Lower_Step_02", "group": "单级", "loop": false, "ch": 1, "dur": 0.83, "lufs": -21.0}, {"path": "sfx/24_Stairs_Lower/SFX_Stairs_Lower_Step_03.wav", "name": "SFX_Stairs_Lower_Step_03", "group": "单级", "loop": false, "ch": 1, "dur": 0.88, "lufs": -21.6}, {"path": "sfx/24_Stairs_Lower/SFX_Stairs_Lower_Step_04.wav", "name": "SFX_Stairs_Lower_Step_04", "group": "单级", "loop": false, "ch": 1, "dur": 0.89, "lufs": -21.0}], "reason": "月1 入夜后第一条路", "when": "night"}, {"num": 25, "tier": 2, "key": "Selene_Awaken_HalfBridge", "zh": "塞勒涅神像亮起、半桥伸出", "what": "月光整个落进她怀里的月亮：低音区一声很深的颂钵（D3），20 的长音在这里“解决”——摩擦颂钵 D4、A4 一起长起来，最上面是水晶杯的 D6，像整座雕像慢慢亮透。半桥：一段石桥从池沿沿半径伸向水亭（2 秒，比雕像轻的石头摩擦），桥头搅动水面（真实的浪拍礁石里最轻的一段），到头轻轻一顿。", "ue": "Selene_Awaken：dwell 满 1 秒、她亮起来时播（接在 20 的 Lock 后面），放在雕像上。HalfBridge_Extend：半桥开始伸出时播，放在池沿的桥头。", "files": [{"path": "sfx/25_Selene_Awaken_HalfBridge/SFX_Selene_Awaken.wav", "name": "SFX_Selene_Awaken", "group": "神像亮起", "loop": false, "ch": 2, "dur": 4.9, "lufs": -20.0}, {"path": "sfx/25_Selene_Awaken_HalfBridge/SFX_HalfBridge_Extend.wav", "name": "SFX_HalfBridge_Extend", "group": "半桥伸出", "loop": false, "ch": 1, "dur": 3.0, "lufs": -20.0}], "reason": "月5 的解谜奖励", "when": "night"}, {"num": 26, "tier": 2, "key": "ShadowBridge_Join", "zh": "影桥接上", "what": "屋顶细桥的月影在水面上挪过来，正好接上半桥的尽头、亮起来。水面轻轻的波光声（真实的浪拍礁石里最轻的一段，只留中高频），一对摩擦颂钵和水晶杯从差一点点（低 30 音分）滑到正好对上——“对齐了”——然后一起亮开。", "ue": "影桥 on 从 0 往 1 走时播一次（1.4 s 内接上），立体声，放在影桥中点。", "files": [{"path": "sfx/26_ShadowBridge_Join/SFX_ShadowBridge_Join.wav", "name": "SFX_ShadowBridge_Join", "group": "接上", "loop": false, "ch": 2, "dur": 3.6, "lufs": -22.0}], "reason": "通往结局的最后一段路", "when": "night"}, {"num": 27, "tier": 2, "key": "Apple_Place", "zh": "放上金苹果", "what": "结局动作。金苹果轻轻落进浑天仪的铜托：一声软的金属碰金属（HenKonen 的金属轻碰，低通抹软），铜托本身“嗡”一下（铜盘的真实振动比例）；接着苹果从金色变成月白、光一点点亮起来（0.5–3 秒）：颂钵 D4、水晶杯 A5 和 D6 慢慢长起来，最后停在一个很安静的 D 上。", "ue": "放上苹果那一刻播，放在小亭的浑天仪上。不要和结局音乐（13）抢：结局音乐最好在 3 秒以后进来。", "files": [{"path": "sfx/27_Apple_Place/SFX_Apple_Place.wav", "name": "SFX_Apple_Place", "group": "放上", "loop": false, "ch": 2, "dur": 6.0, "lufs": -21.0}], "reason": "结局动作", "when": "night"}, {"num": 28, "tier": 2, "key": "Footstep_Bronze", "zh": "脚步：青铜", "what": "凉鞋踩在厚青铜板上（环道、细桥、半桥）：和石头脚步同一双凉鞋，下面的“实”换成青铜——厚铜板的真实振动比例做的短共振（不是薄铁皮那种空响），叠一点真实的金属地面脚步（nate_asdfg、gristi 的录音，低通）。走 8 个、快走 6 个、落地 2 个。", "ue": "和石头脚步同一套触发，脚下是青铜（Physical Material = Bronze）时换这一组。", "files": [{"path": "sfx/28_Footstep_Bronze/SFX_Footstep_Bronze_Walk_01.wav", "name": "SFX_Footstep_Bronze_Walk_01", "group": "走", "loop": false, "ch": 1, "dur": 0.34, "lufs": -28.0}, {"path": "sfx/28_Footstep_Bronze/SFX_Footstep_Bronze_Walk_02.wav", "name": "SFX_Footstep_Bronze_Walk_02", "group": "走", "loop": false, "ch": 1, "dur": 0.33, "lufs": -28.0}, {"path": "sfx/28_Footstep_Bronze/SFX_Footstep_Bronze_Walk_03.wav", "name": "SFX_Footstep_Bronze_Walk_03", "group": "走", "loop": false, "ch": 1, "dur": 0.34, "lufs": -28.0}, {"path": "sfx/28_Footstep_Bronze/SFX_Footstep_Bronze_Walk_04.wav", "name": "SFX_Footstep_Bronze_Walk_04", "group": "走", "loop": false, "ch": 1, "dur": 0.32, "lufs": -28.0}, {"pa const WHEN_LABEL = { day: "白天", night: "夜里", both: "全程", ui: "界面" };
const TIER_LABEL = { 1: ["第一梯队", "没有它游戏就不成立（1、2、7、12、13 是音乐和时间和声，另外做）"], 2: ["第二梯队", "主线必经的机关和剧情节点"] };

// ───────── 播放：能读文件就用 Web Audio（循环无缝、能加混响），读不了（本地直接双击打开）就退回 <audio> ─────────
let ctx = null, master, wet, conv, irLoaded = false, useMedia = location.protocol === "file:";
const bufs = new Map();
const active = new Set();
let volume = 1;

function setupCtx() {
  if (ctx || useMedia) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { useMedia = true; return; }
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = volume; master.connect(ctx.destination);
  conv = ctx.createConvolver(); wet = ctx.createGain(); wet.gain.value = 0;
  conv.connect(wet); wet.connect(master);
  fetch("ir/IR_Temple_Rotunda.wav").then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => ctx.decodeAudioData(b)).then(buf => { conv.buffer = buf; irLoaded = true; applyReverb(); })
    .catch(() => { document.getElementById("rev").disabled = true; });
}
function applyReverb() {
  if (!ctx) return;
  const on = document.getElementById("rev").checked && irLoaded;
  wet.gain.setTargetAtTime(on ? 0.42 : 0, ctx.currentTime, 0.05);
}
function getBuf(path) {
  if (!bufs.has(path)) bufs.set(path, fetch(path).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(b => ctx.decodeAudioData(b)));
  return bufs.get(path);
}
function playOne(path, { loop = false, at = 0, t0 = null } = {}) {
  // 返回一个能 stop() 的句柄；onend 在自然结束时调用
  const h = { stopped: false, onend: null, stop() {} };
  if (useMedia || !ctx) {
    const a = new Audio(path); a.loop = loop; a.volume = Math.min(1, volume);
    const t = setTimeout(() => a.play().catch(() => {}), at * 1000);
    a.onended = () => { active.delete(h); h.onend && h.onend(); };
    h.stop = () => { h.stopped = true; clearTimeout(t); a.pause(); active.delete(h); };
    active.add(h); return h;
  }
  let src = null;
  getBuf(path).then(buf => {
    if (h.stopped) return;
    src = ctx.createBufferSource(); src.buffer = buf; src.loop = loop;
    const g = ctx.createGain(); g.gain.value = 1;
    src.connect(g); g.connect(master); g.connect(conv);
    src.onended = () => { active.delete(h); if (!h.stopped && h.onend) h.onend(); };
    src.start(Math.max(ctx.currentTime + 0.01, (t0 ?? ctx.currentTime + 0.02) + at));
    h.stop = () => { h.stopped = true; try { g.gain.setTargetAtTime(0, ctx.currentTime, 0.03); src.stop(ctx.currentTime + 0.15); } catch (e) {} active.delete(h); };
  }).catch(() => { fail(path); active.delete(h); h.onend && h.onend(); });
  h.stop = () => { h.stopped = true; active.delete(h); };
  active.add(h); return h;
}
function fail(path) {
  const n = document.getElementById("note");
  n.textContent = "有个文件没读到：" + path + "。如果是在本地打开，先在 audio 文件夹里运行 python -m http.server，再用浏览器打开 http://localhost:8000。";
}
function stopAll() { [...active].forEach(h => h.stop()); document.querySelectorAll(".chip.playing").forEach(c => c.classList.remove("playing")); }

// ───────── 页面 ─────────
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function shortName(name, key) { return name.replace(/^SFX_/, ""); }
function chipFor(f, compact) {
  // 一组里文件多的时候只显示编号（完整文件名在鼠标悬停提示里），免得一排排重复前缀
  const label = compact ? f.name.split("_").pop() : shortName(f.name);
  const c = el("button", { class: "chip" + (f.loop ? " loop" : "") + (compact ? " compact" : ""), type: "button", title: f.name + ".wav", "aria-label": "播放 " + f.name, "aria-pressed": "false" },
    el("i", { class: "tri", "aria-hidden": "true" }), el("span", { text: label }), compact ? null : el("span", { class: "dur", text: f.dur.toFixed(2) + " s" }));
  let h = null;
  c.addEventListener("click", () => {
    setupCtx(); if (ctx && ctx.state === "suspended") ctx.resume();
    if (h) { h.stop(); h = null; c.classList.remove("playing"); c.setAttribute("aria-pressed", "false"); return; }
    h = playOne(f.path, { loop: f.loop });
    c.classList.add("playing"); c.setAttribute("aria-pressed", "true");
    h.onend = () => { h = null; c.classList.remove("playing"); c.setAttribute("aria-pressed", "false"); };
  });
  return c;
}
function seqChip(files, spec) {
  const [label, gap, shuffle] = spec;
  const c = el("button", { class: "chip seq", type: "button", "aria-pressed": "false" }, el("i", { class: "tri", "aria-hidden": "true" }), el("span", { text: label }));
  let hs = null;
  c.addEventListener("click", () => {
    setupCtx(); if (ctx && ctx.state === "suspended") ctx.resume();
    if (hs) { hs.forEach(h => h.stop()); hs = null; c.classList.remove("playing"); return; }
    let order = files.map((_, i) => i);
    if (shuffle) {   // 像 UE 的 Random（不重复）：随机，但相邻两次不重复
      const out = []; let last = -1;
      const n = Math.max(10, files.length);
      for (let k = 0; k < n; k++) { let i; do { i = Math.floor(Math.random() * files.length); } while (i === last && files.length > 1); out.push(i); last = i; }
      order = out;
    }
    c.classList.add("playing");
    const go = () => {
      if (!c.classList.contains("playing")) return;
      const t0 = ctx ? ctx.currentTime + 0.05 : null;   // 一个时钟，节奏不会因为下载快慢走样
      hs = order.map((i, k) => playOne(files[i].path, { at: k * gap * (shuffle ? (0.94 + Math.random() * 0.12) : 1), t0 }));
      hs[hs.length - 1].onend = () => { hs = null; c.classList.remove("playing"); };
    };
    hs = [];
    if (ctx && !useMedia) Promise.all(files.map(f => getBuf(f.path))).then(go, () => { c.classList.remove("playing"); fail(files[0].path); });
    else go();
  });
  return c;
}
function render() {
  const items = DATA.items;
  const nFiles = items.reduce((a, it) => a + it.files.length, 0);
  document.getElementById("lede").textContent =
    `${items.length} 条、${nFiles} 个文件，48 kHz 16 位 WAV，干声。能用真实录音的地方都用真实录音（${Object.keys(DATA.credits).length} 段 CC0 录音）；有音高的声音都在 d 小调五声里（D F G A C），和灰盒的时间和弦不打架。`;
  const list = document.getElementById("list");
  for (const tier of [1, 2]) {
    const [t, sub] = TIER_LABEL[tier];
    list.append(el("h2", { class: "tier" }, t, el("small", { text: sub })));
    for (const it of items.filter(i => i.tier === tier)) {
      const groups = new Map();
      for (const f of it.files) { if (!groups.has(f.group)) groups.set(f.group, []); groups.get(f.group).push(f); }
      const gWrap = el("div", { class: "groups" });
      for (const [g, fs] of groups) {
        const compact = fs.length > 3;
        const prefix = compact ? shortName(fs[0].name).replace(/_\d+$/, "_") : "";
        const row = el("div", { class: "group" }, el("span", { class: "glabel", text: g }));
        const spec = DATA.sequences[g];
        if (spec && fs.length > 2) row.append(seqChip(fs, spec));
        if (compact) row.append(el("span", { class: "prefix", text: prefix + "01–" + fs[fs.length - 1].name.split("_").pop() }));
        fs.forEach(f => row.append(chipFor(f, compact)));
        gWrap.append(row);
      }
      const ue = el("details", { class: "ue" }, el("summary", { text: "UE 里怎么用" }), el("p", { text: it.ue }));
      const art = el("article", { class: "item " + it.when, id: "s" + it.num },
        el("div", { class: "num", text: String(it.num) }),
        el("div", { class: "body" },
          el("div", { class: "head" }, el("h3", { text: it.zh }), el("span", { class: "tag", text: WHEN_LABEL[it.when] }), el("span", { class: "reason", text: it.reason })),
          el("p", { class: "what", text: it.what }),
          ue, gWrap));
      list.append(art);
    }
  }
  const cr = document.getElementById("credits");
  for (const [id, c] of Object.entries(DATA.credits)) {
    cr.append(el("a", { href: c.url, target: "_blank", rel: "noopener" }, el("b", { text: c.user }), " · " + c.title));
  }
  if (useMedia) document.getElementById("note").textContent = "现在是直接打开的本地文件：能播，但没有殿内混响，循环接缝处可能有一点点空隙。在 audio 文件夹里运行 python -m http.server 再打开 http://localhost:8000 就都有了。";
}
document.getElementById("rev").addEventListener("change", () => { setupCtx(); applyReverb(); });
document.getElementById("vol").addEventListener("input", e => { volume = +e.target.value; if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.03); });
document.getElementById("stopAll").addEventListener("click", stopAll);
render();
</script>
